version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
  iperf3-server:
    image: networkstatic/iperf3
    command: -s
    ports:
      - "5201:5201"
    container_name: iperf3-server
