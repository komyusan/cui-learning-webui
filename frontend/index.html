<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CUI Learning WebUI — nmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --text: #e6edf3;
      --muted: #8b949e;
      --terminal-bg: #0a0c10;
      --terminal-green: #39d353;
      --terminal-yellow: #e3b341;
      --terminal-red: #f85149;
      --terminal-cyan: #79c0ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* ─── Header ─── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: 0.02em; }
    header span { font-size: 0.75rem; color: var(--muted); background: #21262d; padding: 2px 8px; border-radius: 9999px; border: 1px solid var(--border); }
    /* ─── Main layout ─── */
    .workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }
    /* ─── Left Panel: Options ─── */
    .left-panel {
      width: 320px;
      min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .options-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; gap: 1.25rem; }
    label.opt-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 0.35rem; letter-spacing: 0.05em; }
    select, input[type="text"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s;
      appearance: none;
    }
    select:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(88,166,255,0.15); }
    .checkbox-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .checkbox-item { display: flex; align-items: center; gap: 0.6rem; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .checkbox-item span { font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; color: var(--text); }
    .checkbox-item .badge { font-size: 0.68rem; color: var(--muted); background: #21262d; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
    /* Command preview */
    .cmd-preview {
      margin-top: auto;
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
    }
    .cmd-preview-label { font-size: 0.68rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .cmd-preview-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--terminal-green);
      word-break: break-all;
      line-height: 1.5;
    }
    .cmd-preview-text .cmd-name { color: var(--terminal-cyan); font-weight: 700; }
    .cmd-preview-text .cmd-flag { color: var(--terminal-yellow); }
    .cmd-preview-text .cmd-target { color: var(--terminal-green); }
    .run-btn {
      margin-top: 1rem;
      width: 100%;
      padding: 0.65rem;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:active { transform: scale(0.98); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    /* ─── Right Panel ─── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Terminal */
    .terminal-pane {
      flex: 1;
      background: var(--terminal-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .terminal-header {
      background: #1c2128;
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .traffic-light { width: 12px; height: 12px; border-radius: 50%; }
    .tl-red { background: #ff5f57; }
    .tl-yellow { background: #febc2e; }
    .tl-green { background: #28c840; }
    .terminal-title { font-size: 0.75rem; color: var(--muted); margin-left: 0.5rem; font-family: 'JetBrains Mono', monospace; }
    .terminal-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .terminal-body::-webkit-scrollbar { width: 6px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .term-prompt { color: var(--terminal-green); }
    .term-cmd { color: var(--terminal-cyan); }
    .term-output { color: #c9d1d9; white-space: pre-wrap; }
    .term-error { color: var(--terminal-red); white-space: pre-wrap; }
    .term-info { color: var(--muted); font-style: italic; }
    .term-success { color: var(--terminal-green); }
    .loading-dots span {
      animation: blink 1.4s infinite;
      color: var(--accent);
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    /* AI Pane */
    .ai-pane {
      height: 220px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .ai-header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .ai-badge { background: linear-gradient(135deg, #6e40c9, #58a6ff); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; font-weight: 700; }
    .ai-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem 1.25rem;
      font-size: 0.83rem;
      line-height: 1.75;
      color: #c9d1d9;
    }
    .ai-body p { margin-bottom: 0.5rem; }
    .ai-body code {
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--terminal-cyan);
    }
    .ai-placeholder { color: var(--muted); font-style: italic; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ CUI Learning WebUI</h1>
    <span>MVP v0.1</span>
    <span id="backendStatus" style="margin-left:auto;">● Backend: 確認中…</span>
  </header>

  <div class="workspace">
    <!-- ══ 左ペイン: オプション選択 ══ -->
    <aside class="left-panel">
      <div class="panel-header"><span class="dot"></span>nmap オプション設定</div>
      <div class="options-body">

        <!-- ターゲット -->
        <div>
          <label class="opt-label" for="target">🎯 スキャン対象 (target)</label>
          <input type="text" id="target" value="192.168.1.1" placeholder="例: 192.168.1.0/24" />
        </div>

        <!-- スキャン種別 -->
        <div>
          <label class="opt-label" for="scanType">🔍 スキャン種別</label>
          <select id="scanType">
            <option value="-sV">-sV　バージョン検出</option>
            <option value="-sS">-sS　SYNスキャン（ステルス）</option>
            <option value="-sT">-sT　TCPコネクトスキャン</option>
            <option value="-sU">-sU　UDPスキャン</option>
            <option value="-sn">-sn　Pingスキャン（ポートスキャンなし）</option>
            <option value="-A">-A　総合スキャン（OS/バージョン/スクリプト）</option>
          </select>
        </div>

        <!-- タイミング -->
        <div>
          <label class="opt-label" for="timing">⏱ タイミングテンプレート</label>
          <select id="timing">
            <option value="-T1">-T1　非常に遅い（IDS回避）</option>
            <option value="-T2">-T2　遅い</option>
            <option value="-T3" selected>-T3　標準（デフォルト）</option>
            <option value="-T4">-T4　速い</option>
            <option value="-T5">-T5　超高速</option>
          </select>
        </div>

        <!-- ポート範囲 -->
        <div>
          <label class="opt-label" for="portRange">🔌 ポート範囲 (空白=デフォルト1000)</label>
          <input type="text" id="portRange" placeholder="例: 80,443 または 1-1024" />
        </div>

        <!-- 追加オプション（チェックボックス）-->
        <div>
          <label class="opt-label">📋 追加オプション</label>
          <div class="checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" id="osDetect" />
              <span>-O</span>
              <span class="badge">OS検出</span>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" id="verbose" />
              <span>-v</span>
              <span class="badge">詳細出力</span>
            </label>
          </div>
        </div>

        <!-- コマンドプレビュー -->
        <div class="cmd-preview">
          <div class="cmd-preview-label">生成コマンド</div>
          <div class="cmd-preview-text" id="cmdPreview">
            <span class="cmd-name">nmap</span>
            <span class="cmd-flag"> -sV</span>
            <span class="cmd-flag"> -T3</span>
            <span class="cmd-target"> 192.168.1.1</span>
          </div>
        </div>

        <button class="run-btn" id="runBtn" onclick="runCommand()">
          <span>▶</span> 実行する
        </button>
      </div>
    </aside>

    <!-- ══ 右ペイン ══ -->
    <div class="right-panel">
      <!-- ターミナル風出力 -->
      <div class="terminal-pane">
        <div class="terminal-header">
          <div class="traffic-light tl-red"></div>
          <div class="traffic-light tl-yellow"></div>
          <div class="traffic-light tl-green"></div>
          <span class="terminal-title">sandbox@docker ~ — nmap</span>
        </div>
        <div class="terminal-body" id="terminalBody">
          <div class="term-info">オプションを選択して「実行する」ボタンを押してください。</div>
          <div class="term-info">コマンドはDockerコンテナ内のサンドボックスで実行されます。</div>
        </div>
      </div>

      <!-- AI解説エリア -->
      <div class="ai-pane">
        <div class="ai-header">
          <span class="ai-badge">AI</span>
          コマンド解説
        </div>
        <div class="ai-body" id="aiBody">
          <p class="ai-placeholder">コマンドを実行すると、各オプションの意味をここに解説します。<br>（AI連携機能は後続バージョンで実装予定）</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";

    // ─── コマンドプレビューのリアルタイム更新 ───
    const fields = ["target", "scanType", "timing", "portRange", "osDetect", "verbose"];
    fields.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener("change", updatePreview);
      if (el) el.addEventListener("input", updatePreview);
    });

    function buildCommandParts() {
      const target   = document.getElementById("target").value.trim() || "TARGET";
      const scanType = document.getElementById("scanType").value;
      const timing   = document.getElementById("timing").value;
      const portRange= document.getElementById("portRange").value.trim();
      const osDetect = document.getElementById("osDetect").checked;
      const verbose  = document.getElementById("verbose").checked;

      const flags = [scanType, timing];
      if (osDetect) flags.push("-O");
      if (verbose)  flags.push("-v");
      if (portRange) flags.push("-p", portRange);

      return { target, flags };
    }

    function updatePreview() {
      const { target, flags } = buildCommandParts();
      const preview = document.getElementById("cmdPreview");
      preview.innerHTML =
        `<span class="cmd-name">nmap</span>` +
        flags.map(f => `<span class="cmd-flag"> ${f}</span>`).join("") +
        `<span class="cmd-target"> ${target}</span>`;
    }

    // ─── バックエンド疎通確認 ───
    async function checkBackend() {
      const statusEl = document.getElementById("backendStatus");
      try {
        const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(3000) });
        if (res.ok) {
          statusEl.textContent = "● Backend: 接続OK";
          statusEl.style.color = "#3fb950";
        } else {
          throw new Error();
        }
      } catch {
        statusEl.textContent = "● Backend: 未接続";
        statusEl.style.color = "#f85149";
      }
    }
    checkBackend();

    // ─── ターミナル出力ヘルパー ───
    function appendTerminal(html) {
      const body = document.getElementById("terminalBody");
      const div = document.createElement("div");
      div.innerHTML = html;
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    function clearTerminal() {
      document.getElementById("terminalBody").innerHTML = "";
    }

    // ─── コマンド実行 ───
    async function runCommand() {
      const target   = document.getElementById("target").value.trim();
      if (!target) { alert("スキャン対象を入力してください"); return; }

      const scanType = document.getElementById("scanType").value;
      const timing   = document.getElementById("timing").value;
      const portRange= document.getElementById("portRange").value.trim();
      const osDetect = document.getElementById("osDetect").checked;
      const verbose  = document.getElementById("verbose").checked;

      const { flags } = buildCommandParts();
      const cmdStr = `nmap ${flags.join(" ")} ${target}`;

      const btn = document.getElementById("runBtn");
      btn.disabled = true;

      clearTerminal();
      appendTerminal(`<span class="term-prompt">student@sandbox:~$</span> <span class="term-cmd">${cmdStr}</span>`);

      // バックエンドが未接続の場合はダミー動作
      const statusEl = document.getElementById("backendStatus");
      if (statusEl.textContent.includes("未接続")) {
        appendTerminal(`<div class="term-info">[デモモード] バックエンド未接続のため、コマンド文字列のみ表示します。</div>`);
        appendTerminal(`<div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>`);
        await new Promise(r => setTimeout(r, 1200));
        document.getElementById("terminalBody").lastChild.remove();
        appendTerminal(`<div class="term-success">✓ 生成コマンド: ${cmdStr}</div>`);
        showAiExplanation(cmdStr, flags);
        btn.disabled = false;
        return;
      }

      // ローディング表示
      appendTerminal(`<div class="loading-dots" id="loading"><span>.</span><span>.</span><span>.</span></div>`);

      try {
        const payload = {
          tool: "nmap",
          options: {
            target,
            scan_type: scanType,
            os_detection: osDetect,
            timing,
            port_range: portRange || null,
          }
        };

        const res = await fetch(`${API_BASE}/api/execute`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: AbortSignal.timeout(60000),
        });

        document.getElementById("loading")?.remove();

        if (!res.ok) {
          const err = await res.json();
          appendTerminal(`<div class="term-error">エラー: ${err.detail || res.statusText}</div>`);
        } else {
          const data = await res.json();
          if (data.stdout) appendTerminal(`<div class="term-output">${escapeHtml(data.stdout)}</div>`);
          if (data.stderr) appendTerminal(`<div class="term-error">${escapeHtml(data.stderr)}</div>`);
          if (data.exit_code === 0) {
            appendTerminal(`<div class="term-success">✓ 終了コード: 0 (成功)</div>`);
          } else {
            appendTerminal(`<div class="term-error">✗ 終了コード: ${data.exit_code}</div>`);
          }
          showAiExplanation(data.command, flags);
        }
      } catch (e) {
        document.getElementById("loading")?.remove();
        appendTerminal(`<div class="term-error">通信エラー: ${e.message}</div>`);
      }

      btn.disabled = false;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    // ─── AI解説（ダミー実装） ───
    function showAiExplanation(cmdStr, flags) {
      const explanations = {
        "-sV": "<code>-sV</code>（バージョン検出）: 開いているポートで動作しているサービスとそのバージョンを検出します。",
        "-sS": "<code>-sS</code>（SYNスキャン）: TCP SYNパケットだけを送る「ステルス」スキャン。完全な接続を確立せず、ログに残りにくい。",
        "-sT": "<code>-sT</code>（TCPコネクト）: 完全なTCPハンドシェイクを行うスキャン。rootなしで実行可能。",
        "-sU": "<code>-sU</code>（UDPスキャン）: UDPポートをスキャン。TCPより遅いが、DNS/SNMPなどの発見に重要。",
        "-sn": "<code>-sn</code>（Pingスキャン）: ポートスキャンを行わずホストの生存確認のみ。ネットワーク内の生きているホストを素早く列挙する際に使用。",
        "-A":  "<code>-A</code>（総合スキャン）: OSの検出・バージョン検出・スクリプトスキャン・tracerouteを一度に実行。情報量が多いが時間がかかる。",
        "-O":  "<code>-O</code>（OS検出）: TCP/IPスタックのフィンガープリンティングによりOSの種類を推定する。",
        "-T1": "<code>-T1</code>（非常に遅い）: IDS/IDPSによる検出を回避するため、パケット送信間隔を最大化。",
        "-T3": "<code>-T3</code>（標準）: nmapのデフォルト速度。速度と信頼性のバランスが取れている。",
        "-T4": "<code>-T4</code>（高速）: 高速ネットワーク向け。速いが、不安定なネットワークではパケットロスが起きやすい。",
      };

      let html = `<p>🔍 <strong>コマンド解析:</strong> <code>${escapeHtml(cmdStr)}</code></p>`;
      flags.forEach(f => {
        const key = f.split(" ")[0];
        if (explanations[key]) html += `<p>• ${explanations[key]}</p>`;
      });
      html += `<p style="color:var(--muted);font-size:0.75rem;margin-top:0.5rem;">※ AI解説機能（OpenAI API連携）は次フェーズで実装予定</p>`;
      document.getElementById("aiBody").innerHTML = html;
    }

    // 初期プレビュー
    updatePreview();
  </script>
</body>
</html>
